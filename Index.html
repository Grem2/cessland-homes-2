<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CESSLAND HOMES – Complete System</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 30% 20%, #0a0f2a, #020617);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      min-height: 100vh;
    }

    /* Glass sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 260px;
      height: 100%;
      background: rgba(15, 25, 55, 0.6);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(90, 150, 255, 0.3);
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 10;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
      padding: 0 1rem;
    }
    .logo h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, #bfd9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .logo h1 span {
      background: #2a5cff;
      color: white;
      font-size: 0.7rem;
      padding: 0.15rem 0.6rem;
      border-radius: 40px;
    }
    .date-time {
      text-align: center;
      font-size: 0.7rem;
      color: #bfd6ff;
      margin-top: 0.5rem;
    }

    .nav-menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      padding: 0 1rem;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 1rem;
      border-radius: 1rem;
      color: #e0edff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
    }
    .nav-item i {
      width: 1.5rem;
      font-size: 1.1rem;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(42, 92, 255, 0.3);
      color: white;
      backdrop-filter: blur(4px);
    }
    .nav-item.active {
      background: rgba(42, 92, 255, 0.5);
      border-left: 3px solid #5a96ff;
    }

    .main-content {
      margin-left: 260px;
      padding: 1.5rem;
    }

    /* Glass card */
    .glass-card {
      background: rgba(20, 35, 80, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 1.5rem;
      border: 1px solid rgba(90, 150, 255, 0.3);
      padding: 1.2rem;
      margin-bottom: 1.5rem;
    }

    /* Module header */
    .module-header {
      margin-bottom: 1.5rem;
    }
    .module-header h2 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .module-header p {
      color: #bfd6ff;
      font-size: 0.9rem;
    }
    .action-bar {
      display: flex;
      gap: 0.8rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .action-btn {
      background: rgba(42, 92, 255, 0.3);
      border: 1px solid rgba(90, 150, 255, 0.5);
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }
    .action-btn:hover {
      background: rgba(42, 92, 255, 0.6);
    }

    /* Metrics grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .metric-card {
      background: rgba(15, 25, 60, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 1.2rem;
      padding: 1rem;
      border: 1px solid rgba(90, 150, 255, 0.3);
    }
    .metric-title {
      font-size: 0.75rem;
      color: #bfd6ff;
      margin-bottom: 0.3rem;
    }
    .metric-value {
      font-size: 1.6rem;
      font-weight: 700;
    }

    /* Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .data-table th, .data-table td {
      padding: 0.7rem 0.3rem;
      text-align: left;
      border-bottom: 1px solid rgba(90, 150, 255, 0.2);
    }
    .status-badge {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
      padding: 0.2rem 0.5rem;
      border-radius: 1rem;
      font-size: 0.7rem;
    }
    .status-warning {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }
    .status-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
    .risk-low {
      color: #86efac;
    }
    .risk-high {
      color: #f87171;
    }

    /* KPI row for dashboard */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .kpi-card {
      background: rgba(15, 25, 60, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 1.2rem;
      padding: 1rem;
      border: 1px solid rgba(90, 150, 255, 0.3);
    }

    /* Two columns for dashboard */
    .two-columns {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 900px) {
      .sidebar { width: 70px; }
      .sidebar .logo h1 span, .sidebar .nav-item span:not(i) { display: none; }
      .main-content { margin-left: 70px; }
      .two-columns { grid-template-columns: 1fr; }
    }
  </style>
</head>

  // Render dashboard
  function renderDashboard() {

          <tr><td>Mary Wanjiku</td><td>Westlands Court - A1-05</td><td>KES 18,000</td><td>26 May, 09:45 AM</td><td><span class="status-badge">Completed</span></td></tr>

  // Render any module
  function renderModule(moduleId, data) {
    const metricsHtml = data.metrics.map(m => `<div class="metric-card"><div class="metric-title">${m.label}</div><div class="metric-value">${m.value}</div></div>`).join('');
    const tableHeaders = Object.keys(data.records[0]).map(key => key.charAt(0).toUpperCase() + key.slice(1));
    const tableRows = data.records.map(record => {
      return `<tr>${Object.values(record).map(val => {
        if (typeof val === 'string' && (val === 'Paid' || val === 'Active' || val === 'Current' || val === 'Matched' || val === 'Ready')) return `<td><span class="status-badge">${val}</span></td>`;
        if (val === 'Overdue' || val === 'Alert' || val === 'Urgent') return `<td><span class="status-warning">${val}</span></td>`;
        if (val === 'Review' || val === 'Pending' || val === 'Sent') return `<td><span class="status-warning">${val}</span></td>`;
        if (val === 'High') return `<td><span class="status-danger">${val}</span></td>`;
        if (val === 'Low') return `<td><span class="risk-low">${val}</span></td>`;
        return `<td>${val}</td>`;
      }).join('')}</tr>`;
    }).join('');
    return `
      <div class="module-header">
        <h2>${moduleId.charAt(0).toUpperCase() + moduleId.slice(1)} Management</h2>
        <p>Cessland Homes Module</p>
        <div class="action-bar">
          <button class="action-btn">Filter</button>
          <button class="action-btn">Export</button>
          <button class="action-btn">+ New Record</button>
        </div>
      </div>
      <div class="metrics-grid">${metricsHtml}</div>
      <div class="glass-card">
        <h3>Operational Records · Live data preview</h3>
        <table class="data-table">
          <thead><tr>${tableHeaders.map(h => `<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    `;
  }

  // Chart instance
  let chartInstance = null;
  function initDashboardChart() {
    const ctx = document.getElementById('collectionChart')?.getContext('2d');
    if (ctx) {
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['4 May', '10 May', '16 May', '22 May', '28 May'],
          datasets: [{ label: 'Total Collected (KES)', data: [850000, 980000, 1120000, 1180000, 1250000], borderColor: '#5a96ff', backgroundColor: 'rgba(90,150,255,0.1)', fill: true, tension: 0.3 }]
        },
        options: { responsive: true, maintainAspectRatio: true, plugins: { tooltip: { callbacks: { label: (ctx) => `KES ${ctx.raw.toLocaleString()}` } }, legend: { labels: { color: '#e0edff' } } }, scales: { y: { ticks: { color: '#bfd6ff', callback: (val) => 'KES ' + (val/1000) + 'k' }, grid: { color: 'rgba(90,150,255,0.2)' } }, x: { ticks: { color: '#bfd6ff' }, grid: { display: false } } } }
      });
    }
  }

  // Navigation
  function navigateTo(page) {
    const main = document.getElementById('mainContent');
    if (page === 'dashboard') {
      main.innerHTML = renderDashboard();
      initDashboardChart();
    } else if (modulesData[page]) {
      main.innerHTML = renderModule(page, modulesData[page]);
    } else {
      main.innerHTML = `<div class="glass-card"><h2>Page under construction</h2><p>The ${page} module will be available soon.</p></div>`;
    }
    // Update active nav
    document.querySelectorAll('.nav-item').forEach(item => {
      if (item.getAttribute('data-page') === page) item.classList.add('active');
      else item.classList.remove('active');
    });
  }

  // Event listeners
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const page = item.getAttribute('data-page');
      navigateTo(page);
    });
  });

  // Initial load
  navigateTo('dashboard');
